name: Deploy BIOSENSE

# Publica o serviço na Cloudflare, aplica as migrações do D1 e gera o APK já
# apontando para o endereço publicado. Rode em Actions → "Deploy BIOSENSE" → Run workflow.
#
# Segredos necessários (Settings → Secrets and variables → Actions → Secrets):
#   CLOUDFLARE_API_TOKEN   token com: Account → Workers Scripts:Edit e D1:Edit;
#                          Zone deltabots.com.br → Workers Routes:Edit e DNS:Edit (domínio personalizado)
#   CLOUDFLARE_ACCOUNT_ID  ID da conta Cloudflare
#   ADMIN_API_KEY          chave mestra do serviço (longa e aleatória)
on:
  workflow_dispatch:

env:
  # Domínio público (painel em /admin/, API em /v1). Vazio = usa só o workers.dev.
  CUSTOM_DOMAIN: biosense.deltabots.com.br

concurrency: deploy-biosense

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.verify.outputs.url }}
    defaults:
      run:
        working-directory: cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Conferir segredos
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ADMIN_API_KEY" ] || missing="$missing ADMIN_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Faltam os segredos:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          if [ ${#ADMIN_API_KEY} -lt 32 ]; then
            echo "::error::ADMIN_API_KEY precisa ter pelo menos 32 caracteres"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Migrações do D1
        run: npx wrangler d1 migrations apply biosense --remote
      - name: Publicar Worker
        id: publish
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n 1)
          if [ -z "$url" ]; then
            echo "::error::Não encontrei o endereço workers.dev na saída do deploy"
            exit 1
          fi
          echo "workers_dev=$url" >> "$GITHUB_OUTPUT"
          echo "Serviço publicado em $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Chave mestra
        run: printf '%s' "$ADMIN_API_KEY" | npx wrangler secret put ADMIN_API_KEY
      - name: Segredos AiDEX (glicemia)
        # Opcionais: sem eles, o módulo AiDEX fica inativo (connect responde 503) e
        # o restante do serviço segue normal. Cadastre em Settings → Secrets → Actions.
        env:
          AIDEX_CLIENT_ID: ${{ secrets.AIDEX_CLIENT_ID }}
          AIDEX_CLIENT_SECRET: ${{ secrets.AIDEX_CLIENT_SECRET }}
        run: |
          if [ -n "$AIDEX_CLIENT_ID" ] && [ -n "$AIDEX_CLIENT_SECRET" ]; then
            printf '%s' "$AIDEX_CLIENT_ID"     | npx wrangler secret put AIDEX_CLIENT_ID
            printf '%s' "$AIDEX_CLIENT_SECRET" | npx wrangler secret put AIDEX_CLIENT_SECRET
            echo "Segredos AiDEX publicados." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::AIDEX_CLIENT_ID/AIDEX_CLIENT_SECRET não configurados; módulo AiDEX ficará inativo."
          fi
      - name: Verificar serviço e escolher o endereço do app
        id: verify
        run: |
          base="${{ steps.publish.outputs.workers_dev }}"
          ok=""
          for i in $(seq 1 6); do
            if curl -fsS "$base/v1/health"; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "::error::O serviço não respondeu em $base/v1/health"; exit 1; }
          url="$base"
          if [ -n "$CUSTOM_DOMAIN" ]; then
            # O certificado do domínio novo pode levar alguns minutos na primeira vez.
            for i in $(seq 1 30); do
              if curl -fsS "https://$CUSTOM_DOMAIN/v1/health" >/dev/null; then url="https://$CUSTOM_DOMAIN"; break; fi
              sleep 10
            done
            if [ "$url" = "$base" ]; then
              echo "::warning::https://$CUSTOM_DOMAIN ainda não responde; o APK usará $base. Rode o deploy de novo quando o domínio estiver ativo."
            fi
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Endereço usado pelo app: $url · painel: $url/admin/" >> "$GITHUB_STEP_SUMMARY"

  apk:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar imagens do Android
        run: python3 scripts/validate_png_resources.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Gerar APK apontando para o serviço publicado
        env:
          BIOSENSE_CLOUD_URL: ${{ needs.deploy.outputs.url }}
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: biosense-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Resumo
        run: |
          echo "APK gerado para ${{ needs.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Painel: ${{ needs.deploy.outputs.url }}/admin/" >> "$GITHUB_STEP_SUMMARY"
