name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários e capturas das telas
        run: ./gradlew recordPaparazziDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biosense-screens
          path: app/src/test/snapshots/images/*.png
          if-no-files-found: ignore
      - name: Publicar capturas na branch ci-screenshots
        # Para revisão rápida pelo navegador (raw.githubusercontent.com). Push feito com o
        # GITHUB_TOKEN não dispara outros workflows.
        if: github.event_name == 'push'
        run: |
          set -e
          mkdir -p /tmp/shots && cp app/src/test/snapshots/images/*.png /tmp/shots/
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Capturas de ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
      - name: Gerar APK
        # Endereço do serviço: variável do repositório BIOSENSE_CLOUD_URL (Settings > Variables).
        env:
          BIOSENSE_CLOUD_URL: ${{ vars.BIOSENSE_CLOUD_URL }}
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: biosense-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
